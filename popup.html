<!DOCTYPE html>
<html>
<head>
  <title>WhatsApp Extractor</title>
  <style>
    body { font-family: sans-serif; width: 350px; padding: 10px; }
    h1 { font-size: 16px; text-align: center; }
    .config-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
    .config-grid label { display: block; font-weight: bold; margin-bottom: 5px; }
    input[type="number"], select { width: 100%; box-sizing: border-box; }
    textarea { width: 100%; height: 150px; box-sizing: border-box; margin-bottom: 10px; }
    .button-group { display: flex; justify-content: space-between; }
    button { padding: 8px 12px; font-size: 14px; cursor: pointer; }
    #start-scan { background-color: #4CAF50; color: white; border: none; }
    #stop-scan { background-color: #f44336; color: white; border: none; }
  </style>
</head>
<body>
  <h1>WhatsApp Contact Extractor</h1>

  <div class="config-grid">
    <div>
      <label for="delay-per-chat">Delay per Chat (ms)</label>
      <input type="number" id="delay-per-chat" value="2000" min="500">
    </div>
    <div>
      <label for="delay-per-scroll">Delay per Scroll (ms)</label>
      <input type="number" id="delay-per-scroll" value="1000" min="500">
    </div>
    <div>
        <label for="max-retries">Max Retries</label>
        <input type="number" id="max-retries" value="3" min="1">
    </div>
    <div>
      <label for="export-format">Export Format</label>
      <select id="export-format">
        <option value="csv">CSV</option>
        <option value="json">JSON</option>
        <option value="vcf">VCF</option>
        <option value="xlsx" disabled>XLSX (soon)</option>
      </select>
    </div>
  </div>

  <textarea id="log-area" readonly placeholder="Progress will be shown here..."></textarea>

  <div class="button-group">
    <button id="start-scan">Start Full Scan</button>
    <button id="stop-scan" disabled>Stop Scan</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
